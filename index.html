const POS = {n:"noun",v:"verb",adj:"adjective",inter:"interjection"};
const norm = s => s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
const esc = s => s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const $ = id => document.getElementById(id);
DATA.forEach(e=>{e._k=norm(e.headword);e._h=norm([e.headword,...e.definitions,...e.synonyms,...e.variants,...e.examples].join(" "))});
DATA.sort((a,b)=>a._k.localeCompare(b._k));
let h="";try{h=decodeURIComponent(location.hash.slice(1))}catch(_){}
const state={q:h,cats:new Set(),pos:""};
$("q").value=state.q;
const letters=[...new Set(DATA.map(e=>/[a-z]/.test(e._k[0])?e._k[0].toUpperCase():"#"))];
$("jump").innerHTML=letters.map(l=>`<a href="#l-${l}">${l}</a>`).join("");
const counts={};DATA.forEach(e=>e.food_category.forEach(c=>counts[c]=(counts[c]||0)+1));
$("cats").innerHTML=Object.keys(CATS).map(c=>`<button class="chip" data-c="${c}" aria-pressed="false">${dot(c)}${CATS[c]}<small>${counts[c]||0}</small></button>`).join("");
function hl(text,q){const s=esc(text);if(!q)return s;const i=norm(text).indexOf(q);if(i<0||norm(text).length!==text.length)return s;return esc(text.slice(0,i))+"<mark>"+esc(text.slice(i,i+q.length))+"</mark>"+esc(text.slice(i+q.length))}
const links = (label,arr)=>arr.length?`<span><b>${label}</b> ${arr.flatMap(x=>x.split(/,\s*/)).map(w=>`<button class="link" data-w="${esc(w)}">${esc(w)}</button>`).join(", ")}</span>`:"";
function render(){
 const q=norm(state.q.trim());
 const rows=DATA.filter(e=>(!state.cats.size||e.food_category.some(c=>state.cats.has(c)))&&(!state.pos||e.pos.includes(state.pos))&&(!q||e._h.includes(q)));
 if(q)rows.sort((a,b)=>(b._k.startsWith(q)-a._k.startsWith(q)));
 $("jump").style.display=q?"none":"flex";
 try{history.replaceState(null,"",q?"#"+encodeURIComponent(state.q.trim()):location.pathname+location.search)}catch(_){}
 $("count").textContent=rows.length===DATA.length?`${DATA.length} entries`:`${rows.length} of ${DATA.length} entries`;
 if(!rows.length){$("list").innerHTML='<div class="empty">No entries match. Try a shorter search or clear the filters.</div>';return}
 let out="",last="";
 for(const e of rows){
  const L=q?"":(/[a-z]/.test(e._k[0])?e._k[0].toUpperCase():"#");
  if(L&&L!==last){out+=`<div class="letter" id="l-${L}">${L}</div>`;last=L}
  out+=`<article class="entry" style="--c1:${COL[e.food_category[0]]||"var(--line)"}"><div><h2>${hl(e.headword,q)}</h2><span class="pos">${e.pos.map(p=>POS[p]||p).join(", ")}</span></div><div>
  <ol class="defs${e.definitions.length>1?" multi":""}">${e.definitions.map(d=>`<li>${hl(d,q)}</li>`).join("")}</ol>
  ${e.examples.map(x=>`<p class="ex">${esc(x)}</p>`).join("")}
  <div class="meta">${e.affixes.length?`<span><b>Affixes</b> ${e.affixes.map(a=>`<span class="tag">${esc(a)}</span>`).join(" ")}</span>`:""}
  ${links("Synonyms",e.synonyms)}${links("Antonyms",e.antonyms)}${links("Variants",e.variants)}${links("See also",e.see_also)}
  ${e.food_category.map(c=>`<span class="cat">${dot(c)}${CATS[c]||c}</span>`).join("")}</div></div></article>`;
 }
 $("list").innerHTML=out;
}
$("q").addEventListener("input",e=>{state.q=e.target.value;render()});
$("pos").addEventListener("change",e=>{state.pos=e.target.value;render()});
$("cats").addEventListener("click",e=>{const b=e.target.closest(".chip");if(!b)return;const c=b.dataset.c;state.cats.has(c)?state.cats.delete(c):state.cats.add(c);b.setAttribute("aria-pressed",state.cats.has(c));render()});
$("list").addEventListener("click",e=>{const b=e.target.closest(".link");if(!b)return;state.q=b.dataset.w;$("q").value=state.q;render();window.scrollTo({top:0})});
$("jump").addEventListener("click",e=>{const a=e.target.closest("a");if(!a)return;e.preventDefault();const t=document.getElementById(a.getAttribute("href").slice(1));if(t)t.scrollIntoView({behavior:"smooth"})});
$("rand").addEventListener("click",()=>{const e=DATA[Math.floor(Math.random()*DATA.length)];state.q=e.headword;state.cats.clear();state.pos="";$("pos").value="";document.querySelectorAll(".chip").forEach(b=>b.setAttribute("aria-pressed","false"));$("q").value=e.headword;render();window.scrollTo({top:0})});
addEventListener("scroll",()=>$("top").classList.toggle("show",scrollY>700),{passive:true});
$("top").addEventListener("click",()=>window.scrollTo({top:0,behavior:"smooth"}));
render();
</script>
</body>
</html>
